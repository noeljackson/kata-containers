name: Commit Message Check
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read # Checkout the exact pull-request head and inspect its commit graph.
  pull-requests: read # Read commit metadata consumed by the pinned policy actions.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  error_msg: |+
    See the document below for help on formatting commits for the project.

    https://github.com/kata-containers/community/blob/main/CONTRIBUTING.md#patch-format

jobs:
  commit-message-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    name: Commit Message Check
    steps:
    - name: Checkout policy projection
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Test compact commit projection
      run: .github/scripts/test-compact-pr-commits.sh

    - name: Test downstream gate policy
      run: .github/scripts/test-downstream-gatekeeper.py

    - name: Select downstream policy commits
      id: 'select-policy-commits'
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        UPSTREAM_REF: main
        UPSTREAM_REPOSITORY: kata-containers/kata-containers
      run: |
        if [[ "$(git rev-parse HEAD)" != "${PR_HEAD_SHA}" ]]; then
          echo "Checkout does not match the pull-request head" >&2
          exit 1
        fi

        read -r -a head_revision <<< "$(git rev-list --parents -n 1 "${PR_HEAD_SHA}")"
        if (( ${#head_revision[@]} != 3 )); then
          echo "Deployment candidate must be an exact two-parent composition" >&2
          exit 1
        fi

        deployment_parent="${head_revision[1]}"
        source_head="${head_revision[2]}"
        if [[ "${deployment_parent}" != "${PR_BASE_SHA}" ]]; then
          echo "First parent does not match the reviewed deployment base" >&2
          exit 1
        fi

        git fetch --no-tags --no-recurse-submodules \
          "https://github.com/${UPSTREAM_REPOSITORY}.git" \
          "${UPSTREAM_REF}"
        upstream_head="$(git rev-parse FETCH_HEAD)"
        upstream_base="$(git merge-base "${source_head}" "${upstream_head}")"
        if [[ "${upstream_base}" != "${upstream_head}" ]]; then
          echo "Source is not based on the current declared upstream head" >&2
          exit 1
        fi

        if [[ -n "$(git rev-list --min-parents=2 "${upstream_base}..${source_head}")" ]]; then
          echo "Upstreamable source history must remain linear" >&2
          exit 1
        fi

        source_count="$(git rev-list --count "${upstream_base}..${source_head}")"
        if (( source_count == 0 )); then
          echo "Composition contains no downstream source commits" >&2
          exit 1
        fi

        policy_shas="$(
          {
            git rev-list --reverse "${upstream_base}..${source_head}"
            printf '%s\n' "${PR_HEAD_SHA}"
          } | jq -Rsc 'split("\n") | map(select(length > 0))'
        )"
        printf 'policy_shas=%s\n' "${policy_shas}" >> "${GITHUB_OUTPUT}"

    - name: Get PR Commits
      id: 'get-pr-commits'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        POLICY_SHAS: ${{ steps.select-policy-commits.outputs.policy_shas }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        commits="$(
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" |
          jq -c --argjson policy_shas "${POLICY_SHAS}" \
            -f .github/scripts/compact-pr-commits.jq
        )"
        jq -e 'type == "array" and all(.[]; has("sha") and has("commit") and has("parents"))' \
          <<< "${commits}" >/dev/null
        byte_count="$(printf '%s' "${commits}" | wc -c)"
        if (( byte_count > 100000 )); then
          echo "Compact commit projection is too large for an action input: ${byte_count} bytes" >&2
          exit 1
        fi
        printf 'commits=%s\n' "${commits}" >> "${GITHUB_OUTPUT}"

    - name: DCO Check
      uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21 # v1.1.0
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}

    - name: Commit Body Missing Check
      if: ${{ success() || failure() }}
      uses: tim-actions/commit-body-check@d2e0e8e1f0332b3281c98867c42a2fbe25ad3f15 # v1.0.2
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}

    - name: Check Subject Line Length
      if: ${{ (env.PR_AUTHOR != 'dependabot[bot]') && ( success() || failure() ) }}
      uses: tim-actions/commit-message-checker-with-regex@d6d9770051dd6460679d1cab1dcaa8cffc5c2bbd # v0.3.1
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
        pattern: '^.{0,75}(\n.*)*$'
        error: 'Subject too long (max 75)'
        post_error: ${{ env.error_msg }}

    - name: Check Body Line Length
      if: ${{ (env.PR_AUTHOR != 'dependabot[bot]') && ( success() || failure() ) }}
      uses: tim-actions/commit-message-checker-with-regex@d6d9770051dd6460679d1cab1dcaa8cffc5c2bbd # v0.3.1
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
        # Notes:
        #
        # - The subject line is not enforced here (see other check), but has
        #   to be specified at the start of the regex as the action is passed
        #   the entire commit message.
        #
        # - This check will pass if the commit message only contains a subject
        #   line, as other body message properties are enforced elsewhere.
        #
        # - Body lines *can* be longer than the maximum if they start
        #   with a non-alphabetic character or if there is no whitespace in
        #   the line.
        #
        #   This allows stack traces, log files snippets, emails, long URLs,
        #   etc to be specified. Some of these naturally "work" as they start
        #   with numeric timestamps or addresses. Emails can but quoted using
        #   the normal ">" character, markdown bullets ("-", "*") are also
        #   useful for lists of URLs, but it is always possible to override
        #   the check by simply space indenting the content you need to add.
        #
        # - A SoB comment can be any length (as it is unreasonable to penalise
        #   people with long names/email addresses :)
        pattern: '(^[^\n]+$|^.+(\n([a-zA-Z].{0,150}|[^a-zA-Z\n].*|[^\s\n]*|Signed-off-by:.*|))+$)'
        error: 'Body line too long (max 150)'
        post_error: ${{ env.error_msg }}

    - name: Check Subsystem
      if: ${{ (env.PR_AUTHOR != 'dependabot[bot]') && ( success() || failure() ) }}
      uses: tim-actions/commit-message-checker-with-regex@d6d9770051dd6460679d1cab1dcaa8cffc5c2bbd # v0.3.1
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}
        pattern: '^[\s\t]*[^:\s\t]+[\s\t]*:'
        error: 'Failed to find subsystem in subject'
        post_error: ${{ env.error_msg }}
